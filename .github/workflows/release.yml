name: Release binaries

# Builds a Linux x86_64 binary, an AppImage, a .deb and an .rpm, tests the packages in
# clean Fedora and Ubuntu containers, and attaches everything to the GitHub Release.
# Runs on every pushed version tag, or by hand for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v1.0.0), or a branch for a rehearsal"
        required: true
      publish:
        description: "Upload to the release (off = build and test only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    # 22.04's older glibc keeps the binary runnable on more distros.
    runs-on: ubuntu-22.04
    env:
      # Passed through env, never interpolated into scripts.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Packaging files (icon, desktop entry) and the package test script from
      # this workflow's own commit, so building an older tag by hand still
      # gets them.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: pkg
          sparse-checkout: |
            packaging
            scripts

      - name: Version check
        # Every format is built from this one commit; refuse to publish if the
        # tag and the version inside the code disagree.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml version: $version, tag: $TAG"
          if [[ "$TAG" == v* && "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi
          if [ -x scripts/release.sh ]; then
            scripts/release.sh check
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/pova --version

      - name: Package
        run: |
          name="pova-${TAG}-x86_64-linux"
          mkdir -p "$name"
          cp target/release/pova README.md LICENSE THIRD_PARTY_NOTICES.md "$name/"
          mkdir -p "$name/scripts" && cp scripts/import-cookie.sh "$name/scripts/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: AppImage
        # pova still uses the system's mpv, yt-dlp and pipewire-utils; the
        # AppImage carries pova itself, its icon and a desktop entry.
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          a=AppDir
          mkdir -p $a/usr/bin $a/usr/share/applications $a/usr/share/icons/hicolor/512x512/apps
          cp target/release/pova $a/usr/bin/
          cp pkg/packaging/appimage/pova.desktop $a/
          cp pkg/packaging/appimage/pova.desktop $a/usr/share/applications/
          cp pkg/packaging/appimage/pova.png $a/
          cp pkg/packaging/appimage/pova.png $a/usr/share/icons/hicolor/512x512/apps/
          ln -s pova.png $a/.DirIcon
          ln -s usr/bin/pova $a/AppRun
          appimage="pova-${TAG}-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $a "$appimage"
          ./"$appimage" --appimage-extract-and-run --version
          sha256sum "$appimage" > "$appimage.sha256"
          echo "APPIMAGE=$appimage" >> "$GITHUB_ENV"

      - name: .deb and .rpm
        run: |
          cargo deb --no-build --no-strip
          cargo generate-rpm
          deb=$(ls target/debian/*.deb) && rpm=$(ls target/generate-rpm/*.rpm)
          cp "$deb" "$rpm" .
          deb=$(basename "$deb") && rpm=$(basename "$rpm")
          sha256sum "$deb" > "$deb.sha256" && sha256sum "$rpm" > "$rpm.sha256"
          echo "DEB=$deb" >> "$GITHUB_ENV" && echo "RPM=$rpm" >> "$GITHUB_ENV"

      # Install each package on a clean system: proves its dependencies resolve
      # from the distro's own repositories and that everything lands in place.
      - name: Test the .rpm on Fedora
        run: pkg/scripts/test-packages.sh rpm "$RPM" fedora:latest

      - name: Test the .deb on Ubuntu
        run: pkg/scripts/test-packages.sh deb "$DEB" ubuntu:24.04

      - name: Upload to the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created by hand right after tagging can take a moment to
          # show up; wait for it before falling back to creating one.
          for i in 1 2 3 4 5 6; do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 10
          done
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "pova $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" "$APPIMAGE" "$APPIMAGE.sha256" \
            "$DEB" "$DEB.sha256" "$RPM" "$RPM.sha256" --clobber

      - name: Publish to crates.io
        # Same commit as the binaries above. Needs a CARGO_REGISTRY_TOKEN repo
        # secret; without it this step only says so.
        if: github.event_name == 'push' || inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::No CARGO_REGISTRY_TOKEN secret; run cargo publish by hand for crates.io."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl -fsS -A "pova-release-ci" "https://crates.io/api/v1/crates/pova/$version" > /dev/null 2>&1; then
            echo "pova $version is already on crates.io"
            exit 0
          fi
          cargo publish --locked --allow-dirty   # CI build outputs sit in the checkout
