# cargo-deny configuration, run in CI by the `deny` job (and locally with
# `cargo deny check`). It fails the build on known security advisories,
# licences outside the list below, crates from outside crates.io, and
# wildcard version requirements.

[graph]
# pova only ships for Linux; don't judge Windows / macOS-only dependencies.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = false

[advisories]
# RustSec database: vulnerabilities always fail; unmaintained crates are
# reported for our direct dependencies.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with pova's MIT licence.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
